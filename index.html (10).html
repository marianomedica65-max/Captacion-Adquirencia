*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#004040;--teal2:#006B6B;--ora:#E8501A;
  --bp:#D4006A;--bpl:#F9D0E5;--bpd:#7B0040;
  --fis:#E87722;--fisl:#FDE9D5;--fisd:#7B3000;
  --am:#854F0B;--aml:#FFF2CC;
  --g:#F0F4F4;--g2:#D8E4E4;--g3:#6B8080;--txt:#1A2A2A;
  --s2:#F8FBFB;
  --ok-bg:#E6F4EC;--ok-c:#155724;
  --wa-bg:#FFF3CD;--wa-c:#7B5800;
}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--g);color:var(--txt);font-size:14px;line-height:1.5}

/* HEADER */
.hdr{background:var(--teal);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ora);gap:12px}
.hdr-brand{display:flex;align-items:center;gap:14px}
.hdr-title{color:#fff;font-size:16px;font-weight:700}
.hdr-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:1px}

/* NAV SEGMENTOS */
.nav{display:flex;background:var(--teal2);overflow-x:auto;padding:0 24px;gap:0}
.nav button{padding:11px 18px;font-size:12.5px;font-weight:500;cursor:pointer;border:none;background:none;color:rgba(255,255,255,.65);border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-color:var(--ora);font-weight:600}

/* CONTENT */
.content{padding:20px 24px;max-width:1300px;margin:0 auto}
.seg{display:none}.seg.on{display:block}

/* INFO TABS */
.itabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.it{padding:6px 15px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--g2);background:#fff;color:var(--g3);transition:all .15s}
.it:hover{border-color:var(--teal);color:var(--teal)}
.it.on-bp{background:var(--bp);border-color:var(--bp);color:#fff}
.it.on-fis{background:var(--fis);border-color:var(--fis);color:#fff}
.it.on-am{background:var(--am);border-color:var(--am);color:#fff}
.it.on-ov{background:var(--teal);border-color:var(--teal);color:#fff}

/* SEG HEADER */
.seg-badge{display:inline-flex;align-items:center;padding:3px 14px;border-radius:100px;font-size:10.5px;font-weight:700;letter-spacing:.05em;margin-bottom:9px}
.seg-title{font-size:22px;font-weight:700;margin-bottom:3px}
.seg-sub{font-size:12.5px;color:var(--g3);margin-bottom:18px}

/* CARDS GRID */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;border:1px solid var(--g2);overflow:hidden;box-shadow:0 1px 4px rgba(0,64,64,.06)}
.card-top{padding:13px 16px}
.card-top-t{font-size:12px;font-weight:700;color:#fff;letter-spacing:.03em}
.card-top-s{font-size:10.5px;color:rgba(255,255,255,.8);margin-top:2px}
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.rlbl{font-size:10px;font-weight:700;color:var(--g3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.rval{font-size:12.5px;color:var(--txt);line-height:1.55}

/* PILLS */
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pill{font-size:10.5px;font-weight:500;padding:3px 10px;border-radius:100px}
.pbp{background:var(--bpl);color:var(--bpd)}
.pfis{background:var(--fisl);color:var(--fisd)}
.pn{background:var(--g);color:var(--g3);border:1px solid var(--g2)}

.pblock{border-radius:10px;padding:13px 15px}
.phdr{font-size:10px;font-weight:700;margin-bottom:8px;letter-spacing:.03em;opacity:.85}

.plbl{opacity:.75}
.pval{font-weight:600}

.ptot-l{font-size:11.5px;font-weight:600}
.ptot-v{font-size:20px;font-weight:700}
.pdeb{display:flex;justify-content:space-between;font-size:10px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.15)}

.fis-wrap{border-radius:8px;overflow:hidden;border:1.5px solid var(--fisl)}
.fis-th-row{background:var(--fis);display:grid;padding:6px 11px;font-size:10px;font-weight:600;color:#fff;letter-spacing:.04em}
.fis-row{display:grid;padding:6.5px 11px;font-size:11.5px;border-bottom:1px solid var(--fisl);background:#fff}
.fis-row:last-child{border-bottom:none}

.cblock-t{font-size:12.5px;font-weight:700;margin-bottom:3px}

.asesor-contact a{color:var(--teal2);text-decoration:none;font-weight:500}

.promo-dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0;margin-top:5px}

.ov-table tbody tr:hover td{background:var(--g);cursor:pointer}
.ov-table tbody tr:last-child td{border-bottom:none}

.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.contact-card-name{font-size:14px;font-weight:700;color:var(--txt)}
.contact-card-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--g3)}
.contact-card-row a{color:var(--teal2);text-decoration:none;font-weight:500}
.contact-card-row a:hover{text-decoration:underline}
.contact-card-row svg{width:14px;height:14px;flex-shrink:0;color:var(--g3)}
.web-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:var(--teal);color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;transition:all .15s;margin-top:6px}
.web-link:hover{background:var(--teal2)}
.web-link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:700px){.dual{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>

function searchTerreno(q){
  const q2=q.trim().toLowerCase();
  const el=document.getElementById('terreno-results');
  if(!q2){el.innerHTML='<div class="no-results">Escribí una localidad para ver el asesor de esa zona</div>';return;}
  const matches=ASESORES.map(a=>{
    const zonas=a.zonas.filter(z=>z.toLowerCase().includes(q2));
    return{...a,zonas,matched:zonas.length>0};
  }).filter(a=>a.matched);
  if(!matches.length){el.innerHTML=`<div class="no-results">Sin resultados para "<strong>${q}</strong>". Probá con otra localidad.</div>`;return;}
  el.innerHTML=matches.map(a=>`
    <div class="asesor-card">
      <div class="asesor-head">
        <div class="asesor-avatar" style="background:${a.color}">${a.nom.split(' ').map(p=>p[0]).join('').slice(0,2)}</div>

        <span class="asesor-contact"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.36 1.18 2 2 0 012.34 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.34 6.34l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><a href="tel:${a.tel.replace(/\s/g,'')}">${a.tel}</a></span>

// SECTION BUILDER
// ════════════════════════════════════════════
function buildSections(data,info,brand){
  const todo=info==='todo';
  const col=brand==='fis'?'var(--fis)':brand==='dual'?'var(--am)':'var(--teal)';
  function secHdr(lbl){return todo?`<div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:${col};margin:16px 0 8px;padding-bottom:5px;border-bottom:1.5px solid var(--g2);display:flex;align-items:center;gap:7px"><span style="width:7px;height:7px;border-radius:50%;background:${col};display:inline-block"></span>${lbl}</div>`:''}
  const ps=[];
  if(todo||info==='cliente'){ps.push(secHdr('Tipo de cliente'));ps.push(`<div class="rval">${data.tipo}</div>`);}
  if(todo||info==='cobro'){ps.push(secHdr('Modalidad de cobro'));ps.push(`<div class="pills">${data.modos.map(m=>`<span class="pill ${brand==='fis'?'pfis':'pbp'}">${m}</span>`).join('')}</div>`);}
  if(todo||info==='terminal'){
    ps.push(secHdr('Terminal y acreditación'));
    ps.push(`<div><div class="rlbl">Terminal</div><div class="rval"><strong>${data.terminal}</strong></div></div>`);
    ps.push(`<div><div class="rlbl">Acreditación</div><div class="rval">${data.acred||data.acreditacion||'Según plan'}</div></div>`);
    if(data.planes&&data.planes.length) ps.push(`<div><div class="rlbl">Planes de cuotas</div><div class="pills">${data.planes.map(p=>`<span class="pill pbp">${p}</span>`).join('')}</div></div>`);
  }
  if(todo||info==='pricing'){
    ps.push(secHdr('Condiciones y aranceles'));
    if(brand==='bp'&&data.pr) ps.push(bpPr(data.pr));
    else if(data.fisPr) ps.push(fisPr(data.fisPr));
  }
  if(todo||info==='promos'){ps.push(secHdr('Promociones'));ps.push(promosBlock(data.promos,brand));}
  if(todo||info==='canal'){
    ps.push(secHdr('Canal de derivación'));
    ps.push(canalBlock(data.canal,data.hasForm,data.hasTerreno,brand));
  }
  return ps.join('');
}

          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          www.taca-taca.com.ar
        </a>
      </div>
    </div>`;
}

// ════════════════════════════════════════════
// RENDER SEG
// ════════════════════════════════════════════
let activeSeg='overview', activeInfo='todo';

const INFO_TABS=[
  {id:'todo',lbl:'Vista completa'},
  {id:'cliente',lbl:'Tipo de cliente'},
  {id:'cobro',lbl:'Modalidad de cobro'},
  {id:'terminal',lbl:'Terminal y acreditación'},
  {id:'pricing',lbl:'Condiciones y aranceles'},
  {id:'promos',lbl:'Promociones'},
  {id:'canal',lbl:'Canal de derivación'},
];

function render(){
  const allTabs=[{id:'overview',label:'Resumen',brand:'ov'},...SEGS.filter(s=>s.id!=='overview')];
  document.getElementById('nav').innerHTML=allTabs.map(s=>{
    const on=s.id===activeSeg;
    let cls='';
    if(on) cls=s.brand==='fis'?'on':s.brand==='dual'?'on':s.id==='overview'?'on':'on';
    return `<button class="${cls}" onclick="goSeg('${s.id}')">${s.label}</button>`;
  }).join('');

  if(activeSeg==='overview'){
    document.getElementById('content').innerHTML=`<div style="padding-top:4px">${renderOverview()}</div>`;
    return;
  }

  const seg=SEGS.find(s=>s.id===activeSeg);
  const brand=seg.brand;
  const tabAc=brand==='fis'?'on-fis':brand==='dual'?'on-am':'on-bp';
  const badgeColor=brand==='fis'?'var(--fisd)':brand==='dual'?'var(--am)':'var(--bpd)';

  const header=`
    <div class="seg-badge" style="background:${seg.badgeBg};color:#fff">${seg.badge}</div>
    <div class="seg-title" style="color:${badgeColor}">${seg.label} <span style="font-weight:400;font-size:17px;color:var(--g3)">${seg.range}</span></div>
    <div class="seg-sub">${seg.desc}</div>`;

  const itabs=`<div class="itabs">${INFO_TABS.map(t=>`<button class="it ${t.id===activeInfo?tabAc:''}" onclick="setInfo('${t.id}')">${t.lbl}</button>`).join('')}</div>`;

  let main='';
  if(seg.dual){
    const varsHtml=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--bp);display:inline-block;flex-shrink:0"></span><strong>1–3 locales</strong> → Bezza Pay
      <span style="color:var(--g3);margin:0 4px">·</span>
      <span style="width:8px;height:8px;border-radius:50%;background:var(--fis);display:inline-block;flex-shrink:0"></span><strong>4+ sucursales</strong> → Fiserv/Payway
    </div>${seg.vars.slice(1).map(v=>`<div style="display:flex;gap:6px;align-items:baseline;margin-top:3px"><span style="width:5px;height:5px;border-radius:50%;background:var(--am);display:inline-block;flex-shrink:0;margin-top:5px"></span><span style="font-size:12px">${v}</span></div>`).join('')}`;
    const cards=seg.options.map(opt=>`
      <div class="card">
        <div class="card-top" style="background:${opt.hdrBg}"><div class="card-top-t">${opt.label}</div><div class="card-top-s">${opt.cond}</div></div>
        <div class="card-body">${buildSections(opt,activeInfo,opt.brand)}</div>
      </div>`).join('');
    main=`<div class="dual-note"><strong style="color:var(--am)">Variables a evaluar:</strong><br>${varsHtml}</div><div class="dual">${cards}</div>`;
  } else {
    main=`<div class="cards"><div class="card">
      <div class="card-top" style="background:${seg.badgeBg}"><div class="card-top-t">${seg.pv}</div><div class="card-top-s">${seg.range}</div></div>
      <div class="card-body">${buildSections(seg,activeInfo,brand)}</div>
    </div></div>`;
  }

  document.getElementById('content').innerHTML=header+itabs+main;
}

function goSeg(id){activeSeg=id;activeInfo='todo';render();}
function setInfo(id){activeInfo=id;render();}
render();
</script>
</body>
</html>
